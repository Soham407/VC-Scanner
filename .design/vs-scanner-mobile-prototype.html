
<!doctype html>
<html lang="en">
<head><script>(function(){
  function makeStore(){
    var data = {};
    var api = {
      getItem: function(k){ return Object.prototype.hasOwnProperty.call(data, k) ? data[k] : null; },
      setItem: function(k, v){ data[k] = String(v); },
      removeItem: function(k){ delete data[k]; },
      clear: function(){ data = {}; },
      key: function(i){ return Object.keys(data)[i] || null; }
    };
    Object.defineProperty(api, 'length', { get: function(){ return Object.keys(data).length; } });
    return api;
  }
  function tryShim(name){
    var works = false;
    try { works = !!window[name] && typeof window[name].getItem === 'function'; void window[name].length; }
    catch (_) { works = false; }
    if (works) return;
    try { Object.defineProperty(window, name, { configurable: true, value: makeStore() }); }
    catch (_) { try { window[name] = makeStore(); } catch (__) {} }
  }
  tryShim('localStorage');
  tryShim('sessionStorage');
})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VS Scanner · Mobile Prototype</title>
<style>
:root{--bg:oklch(97% .012 80);--surface:oklch(99% .005 80);--fg:oklch(20% .02 60);--muted:oklch(48% .015 60);--border:oklch(89% .012 80);--accent:oklch(58% .16 35);--font-display:'Iowan Old Style','Charter',Georgia,serif;--font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;--font-mono:'SF Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,color-mix(in oklch,var(--accent) 5%,var(--bg)),var(--bg) 380px);color:var(--fg);font-family:var(--font-body);-webkit-font-smoothing:antialiased}.page{max-width:1500px;margin:auto;padding:40px 24px 72px}.mast{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding-bottom:28px;border-bottom:1px solid var(--border);margin-bottom:28px}.kicker{margin:0 0 8px;color:var(--accent);font:700 11px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase}h1{margin:0;font-family:var(--font-display);font-size:clamp(44px,7vw,86px);line-height:.92;max-width:9ch}.mast p:last-child{max-width:46ch;margin:0;color:var(--muted);line-height:1.55}.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}.legend span{border:1px solid var(--border);border-radius:999px;padding:7px 10px;color:var(--muted);font:700 11px/1 var(--font-mono);letter-spacing:.04em;text-transform:uppercase;background:var(--surface)}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(390px,1fr));gap:34px 28px}.stage{display:flex;flex-direction:column;align-items:center;gap:14px}.caption{width:390px;display:flex;justify-content:space-between;color:var(--muted);font:700 11px/1.2 var(--font-mono);letter-spacing:.08em;text-transform:uppercase}.caption strong{color:var(--fg)}
.device{position:relative;width:390px;height:844px;border-radius:56px;padding:12px;background:linear-gradient(160deg,#2a2a2c,#171719 55%,#09090a);box-shadow:0 0 0 1px rgba(255,255,255,.05) inset,0 0 0 2px #000 inset,0 28px 60px -16px rgba(0,0,0,.45)}.device:before,.device:after{content:"";position:absolute;width:3px;top:100px;bottom:100px;background:linear-gradient(to bottom,transparent,rgba(255,255,255,.07) 12%,transparent 20%,transparent 82%,rgba(255,255,255,.04),transparent)}.device:before{left:-1px}.device:after{right:-1px}.island{position:absolute;z-index:3;top:22px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:999px;background:#000}.screen{width:100%;height:100%;border-radius:44px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}.statusbar{flex:0 0 47px;padding:18px 26px 0;display:flex;justify-content:space-between;font-size:15px;font-weight:700}.statusbar .right{display:flex;gap:6px;align-items:center}.statusbar svg{width:17px;height:11px;fill:var(--fg)}.statusbar .battery{width:25px}.content{flex:1;overflow-y:auto;padding:8px 0 28px}.home{flex:0 0 28px;position:relative}.home:after{content:"";position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;border-radius:999px;background:var(--fg);opacity:.86}
.pad{padding-inline:20px}.stack{display:flex;flex-direction:column;gap:14px}.row{display:flex;align-items:center;gap:10px}.between{display:flex;align-items:center;justify-content:space-between;gap:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.header{padding:8px 20px 12px;display:flex;justify-content:space-between;align-items:center}.greeting{margin:0 0 4px;color:var(--muted);font:700 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase}h2{margin:0;font-family:var(--font-display);font-size:27px;line-height:1.08}.h3{font-weight:760;font-size:16px}.meta,.sub{color:var(--muted);font-size:13px;line-height:1.35}.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}.card{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:14px}.accent{border-color:color-mix(in oklch,var(--accent) 35%,var(--border));background:color-mix(in oklch,var(--accent) 7%,var(--surface))}.list{min-height:58px;display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}.title{font-size:14px;font-weight:750}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:color-mix(in oklch,var(--fg) 5%,transparent);border:1px solid var(--border);font:800 11px/1 var(--font-mono)}.pill,.tag{display:inline-flex;min-height:28px;align-items:center;border-radius:999px;padding:6px 9px;font:700 11px/1 var(--font-mono);letter-spacing:.03em;white-space:nowrap}.pill{background:var(--fg);color:var(--surface)}.tag{border:1px solid var(--border);background:var(--surface);color:var(--muted)}button{font:inherit}.primary,.secondary{width:100%;min-height:48px;border-radius:999px;border:0;font-weight:760}.primary{background:var(--fg);color:var(--surface)}.secondary{background:var(--surface);border:1px solid var(--border)}.alert{border-left:3px solid var(--accent);padding:12px 12px 12px 14px;background:var(--surface);border-radius:0 8px 8px 0}.field{min-height:48px;border-bottom:1px solid var(--border);display:grid;gap:3px;padding:10px 0}.field label{color:var(--muted);font:700 10px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase}.capture{height:356px;margin:2px 12px 16px;border-radius:18px;background:linear-gradient(90deg,rgba(255,255,255,.2) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.2) 1px,transparent 1px),linear-gradient(145deg,oklch(22% .02 60),oklch(45% .03 60));background-size:44px 44px,44px 44px,auto;position:relative}.ghost{position:absolute;left:34px;right:34px;top:104px;height:144px;border:2px solid rgba(255,255,255,.82);border-radius:12px;background:rgba(255,255,255,.11);transform:rotate(-2deg)}.scan{position:absolute;left:38px;right:38px;top:164px;height:2px;background:var(--accent);box-shadow:0 0 18px var(--accent)}.tabbar{position:sticky;bottom:-28px;margin-top:16px;border-top:1px solid var(--border);background:color-mix(in oklch,var(--bg) 80%,transparent);backdrop-filter:blur(16px);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 10px 4px}.tab{min-height:50px;color:var(--muted);display:grid;place-items:center;font:700 10px/1 var(--font-mono);text-transform:uppercase}.tab.active{color:var(--accent)}@media(max-width:460px){.page{padding:28px 10px 48px}.mast{grid-template-columns:1fr}.gallery{grid-template-columns:1fr}.device,.caption{width:min(390px,100vw - 20px)}}
</style>
</head>
<body>
<div class="page">
<header class="mast"><div><p class="kicker">VS Scanner · mobile system</p><h1>Capture now. Assign after.</h1></div><p>High-fidelity screen set for event staff, Team Leaders, and Workers. Canonical language is used throughout: Team, Team Inbox, Pending Invite, Batch Assignment, Assignment, and Worker.</p></header>
<div class="legend"><span>Event capture</span><span>Team leadership</span><span>Worker focus</span><span>Invite flow</span></div>
<main class="gallery" id="gallery" data-od-id="gallery"></main>
</div>
<script>
const icons='<svg viewBox="0 0 18 12"><path d="M1 11h2V8H1v3Zm4 0h2V6H5v5Zm4 0h2V4H9v7Zm4 0h2V2h-2v9Z"/></svg><svg viewBox="0 0 18 12"><path d="M9 11.5 1.5 4C5.7.1 12.3.1 16.5 4L9 11.5Zm0-3.4 3.9-3.9a6 6 0 0 0-7.8 0L9 8.1Z"/></svg><svg class="battery" viewBox="0 0 28 12"><path d="M2 2h21a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H2V2Zm24 3h1v2h-1V5Z"/></svg>';
const tabbar='<nav class="tabbar"><div class="tab">Scan</div><div class="tab active">Inbox</div><div class="tab">Assign</div><div class="tab">Team</div></nav>';
const screens=[
['01 Capture','Selected Team gate',`<div class="header" data-od-id="header-capture"><div><p class="greeting">Finsbury Summit · active Team</p><h2>Scan card</h2></div><span class="tag">Switch</span></div><div class="capture" data-od-id="scan-camera"><div class="ghost"></div><div class="scan"></div></div><section class="pad stack"><div class="alert"><b>First scan after switching Team</b><p class="meta">This card will be saved to Finsbury Summit.</p></div><button class="primary">Confirm Team and capture</button><button class="secondary">Switch Team</button></section>`],
['02 Pending Invite','Forced decision',`<section class="pad stack" style="padding-top:18px;min-height:100%"><p class="greeting">Pending Invite</p><h2 data-od-id="invite-title">Join Midtown Expo as a Worker?</h2><p class="meta">This invite was sent to priya@fieldline.co. Only that email address can accept it.</p><div class="card accent" data-od-id="invite-card"><div class="between"><span class="tag">Team</span><span class="num">INV-2048</span></div><p class="h3">Midtown Expo</p><p class="meta">Sent by Elena Brooks, Team Leader</p></div><div class="card"><div class="between"><span>Role after accept</span><b>Worker</b></div><div class="between"><span>Access</span><span class="meta">Assigned scans only</span></div></div><div class="stack" style="margin-top:auto"><button class="primary">Accept invite</button><button class="secondary">Decline invite</button></div></section>`],
['03 OCR Review','Contact extraction',`<div class="header"><div><p class="greeting">Finsbury Summit</p><h2>Review scan</h2></div><span class="tag">OCR 91%</span></div><section class="pad stack"><div class="card accent"><b>Rohan Mehta</b><p class="meta">Vector Supply Co.</p><p class="num">+1 415 018 4421</p></div><div class="card" data-od-id="extracted-fields"><div class="field"><label>Name</label><b>Rohan Mehta</b></div><div class="field"><label>Role</label><b>Partnerships Director</b></div><div class="field"><label>Email</label><b>rohan@vectorsupply.com</b></div><div class="field"><label>Phone</label><b class="num">+1 415 018 4421</b></div></div><button class="primary">Save to Team Inbox</button><button class="secondary">Retake</button></section>`],
['04 Saved Scan','Team Inbox result',`<div class="header"><div><p class="greeting">Unassigned scan</p><h2>Rohan Mehta</h2></div><span class="pill">Team Inbox</span></div><section class="pad stack"><div class="card"><p class="meta">Company</p><p class="h3">Vector Supply Co.</p><p class="meta">Captured by Nina Patel at 10:18 AM. Not visible to Workers until assigned.</p></div><div class="grid" data-od-id="scan-stats"><div class="card"><p class="meta">Source</p><b>Camera</b></div><div class="card"><p class="meta">Assignment</p><b>None</b></div></div><div class="card"><p class="meta">Notes</p><p>Asked for enterprise pricing and a follow-up before Friday.</p></div><button class="primary">Add to Batch Assignment</button></section>`],
['05 Team Inbox','Team Leader view',`<div class="header"><div><p class="greeting">Team Leader · Finsbury Summit</p><h2>Team Inbox</h2></div><span class="tag">New</span></div><section class="pad"><div class="row"><span class="pill">Unassigned · 18</span><span class="tag">Assigned · 42</span></div></section><section class="pad" data-od-id="team-inbox-list">${rows([['RM','Rohan Mehta · Vector Supply','Captured 10:18 AM by Nina','NEW'],['AK','Avery Kim · Northstar Labs','Asked for security review','NEW'],['MS','Marta Silva · Coastline AI','Duplicate check suggested','OCR'],['JB','Jon Bell · RelayWorks','Asked for follow-up Monday','NEW']])}</section>${tabbar}`],
['06 Batch Draft','Edit before approval',`<div class="header"><div><p class="greeting">Manual Batch Assignment</p><h2>Draft split</h2></div><span class="tag">18 scans</span></div><section class="pad stack" data-od-id="batch-draft"><div class="card accent"><b>Least-loaded distribution</b><p class="meta">Round-robin fallback used for equal loads. Nothing is assigned until approval.</p></div>${worker('Nina Patel',6)}${worker('Omar Reyes',6)}${worker('Priya Shah',6)}<button class="secondary">Edit scan list</button><button class="primary">Review for approval</button></section>`],
['07 Batch Approval','Team Leader decision',`<section class="pad stack" style="padding-top:18px;min-height:100%"><p class="greeting">Final approval</p><h2 data-od-id="approval-title">Create 18 Assignments?</h2><p class="meta">A Worker will only see scans placed into their Assignments. Team Leaders keep full visibility after approval.</p><div class="grid" data-od-id="approval-summary"><div class="card"><p class="meta">Scans</p><b class="num" style="font-size:28px">18</b></div><div class="card"><p class="meta">Workers</p><b class="num" style="font-size:28px">3</b></div></div><div class="card"><div class="between"><span>Assignment State</span><b>Open</b></div><div class="between"><span>Creation</span><span class="meta">Manual by Team Leader</span></div></div><div class="stack" style="margin-top:auto"><button class="primary">Approve Batch Assignment</button><button class="secondary">Keep editing</button></div></section>`],
['08 Worker','Assigned scans only',`<div class="header"><div><p class="greeting">Worker · Priya Shah</p><h2>Assignments</h2></div><span class="pill">6 open</span></div><section class="pad"><div class="row"><span class="pill">Open · 6</span><span class="tag">Done · 11</span><span class="tag">Needs review · 2</span></div></section><section class="pad" data-od-id="worker-list">${rows([['RM','Rohan Mehta','Vector Supply · follow up before Friday','A-142'],['LT','Lena Torres','Cobalt Ventures · needs LinkedIn','A-143'],['DB','Dev Batra','Procurement lead · card photo clear','A-144']])}</section>${tabbar}`],
['09 Assignment','Follow-up detail',`<div class="header"><div><p class="greeting">Assignment A-142</p><h2>Rohan Mehta</h2></div><span class="tag">Open</span></div><section class="pad stack"><div class="card accent"><b>Vector Supply Co.</b><p class="meta">Partnerships Director</p><p class="num">rohan@vectorsupply.com</p></div><div class="card"><p class="meta">Follow-up context</p><p>Asked for enterprise pricing and a contact at procurement. Captured by Nina Patel.</p></div><div class="grid"><button class="secondary">Needs review</button><button class="primary">Mark done</button></div><div class="card"><div class="between"><span>Visible to</span><b>Priya Shah</b></div><p class="meta">Team Leaders can still see and reassign this Assignment.</p></div></section>`],
['10 Needs Review','Worker signal',`<section class="pad stack" style="padding-top:18px;min-height:100%"><p class="greeting">Assignment State</p><h2>Mark as needs review?</h2><p class="meta">Use this when the scan has incomplete contact details or the Worker needs help from a Team Leader.</p><div class="card accent"><b>Reason</b><p class="meta">Email domain does not match the company name on the card.</p></div><div class="card"><div class="field"><label>Assignment</label><b>A-143 · Lena Torres</b></div><div class="field"><label>Worker</label><b>Priya Shah</b></div><div class="field"><label>Team</label><b>Finsbury Summit</b></div></div><div class="stack" style="margin-top:auto"><button class="primary">Mark needs review</button><button class="secondary">Cancel</button></div></section>`],
['11 Team Switch','One active Team',`<div class="header"><div><p class="greeting">Memberships</p><h2>Active Team</h2></div><span class="tag">3 Teams</span></div><section class="pad stack" data-od-id="team-switch-list"><div class="card accent"><div class="between"><b>Finsbury Summit</b><span class="pill">Active</span></div><p class="meta">Team Leader · 60 scans today</p></div><div class="card"><div class="between"><b>Midtown Expo</b><span class="tag">Worker</span></div><p class="meta">6 open Assignments</p></div><div class="card"><div class="between"><b>Founders Dinner</b><span class="tag">Team Leader</span></div><p class="meta">No new Team Inbox scans</p></div><div class="alert"><b>Next scan will ask for confirmation</b><p class="meta">This prevents cards from being saved to the wrong Team.</p></div></section>`],
['12 Team','Memberships and invites',`<div class="header"><div><p class="greeting">Finsbury Summit</p><h2>Team</h2></div><span class="tag">Invite</span></div><section class="pad stack"><div class="grid" data-od-id="team-stats"><div class="card"><p class="meta">Team Leaders</p><b class="num" style="font-size:28px">2</b></div><div class="card"><p class="meta">Workers</p><b class="num" style="font-size:28px">8</b></div></div><div class="card"><div class="between"><b>Pending Invites</b><span class="num">3</span></div>${rows([['OR','omar@fieldline.co','Worker invite · sent today','Pending'],['EB','elena@fieldline.co','Team Leader invite','Pending']])}</div><button class="primary">Send Invite</button></section>${tabbar}`]
];
function rows(items){return items.map(x=>`<div class="list"><div class="avatar">${x[0]}</div><div><div class="title">${x[1]}</div><div class="sub">${x[2]}</div></div><span class="num">${x[3]}</span></div>`).join('')}
function worker(n,c){return `<div class="card"><div class="between"><span>${n}</span><b class="num">${c}</b></div><div style="height:7px;border-radius:999px;background:var(--border);overflow:hidden;margin-top:9px"><span style="display:block;width:66%;height:100%;background:var(--fg)"></span></div></div>`}
document.getElementById('gallery').innerHTML=screens.map((s,i)=>`<section class="stage"><div class="caption"><strong>${s[0]}</strong><span>${s[1]}</span></div><div class="device" data-od-id="device-${i+1}"><div class="island"></div><main class="screen"><div class="statusbar"><span>9:41</span><span class="right">${icons}</span></div><div class="content" data-od-id="content-${i+1}">${s[2]}</div><div class="home"></div></main></div></section>`).join('');
</script>
</body>
</html>
