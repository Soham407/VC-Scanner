name: Supabase Keep-Alive

on:
  schedule:
    # Runs at 00:00 UTC on Sunday and Wednesday
    - cron: "0 0 * * 0,3"
  workflow_dispatch: 

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/scanned_leads?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
