name: CI

on:
  push:
    branches:
      - main
      - master
      - 'codex/**'
  pull_request:

jobs:
  mobile-and-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - run: npm ci
      - run: npm test -- --runInBand __tests__/nativeConfig.test.ts
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npm run test:supabase-functions
      - run: npm run web:build

  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - run: npm ci
      - run: npm run test
      - run: npm run build
